default_permissions = "workspace"

[features]
codex_hooks = true

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/stop_quality_check.py"'
timeout = 240
statusMessage = "Running final quality checks"

[permissions.workspace.filesystem]
glob_scan_max_depth = 6

[permissions.workspace.filesystem.":project_roots"]
"." = "write"

# Android signing material and local build secrets.
"buildsystem/**" = "deny"
"keystore/**" = "deny"
"keystores/**" = "deny"
"secrets/**" = "deny"
"secret/**" = "deny"
"credentials/**" = "deny"
"credential/**" = "deny"

# Environment and local-machine configuration.
".env" = "deny"
"local.properties" = "deny"

# Android/Firebase/Google Play service credentials.
"app/google-services.json" = "deny"
"google-services.json" = "deny"
"googleplayprovider.json" = "deny"

# App endpoint/OAuth config assets.
# Removed glob rule "app/src/*/assets/configs/*.json" because Codex rejects file globs.