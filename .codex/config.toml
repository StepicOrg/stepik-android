sandbox_mode = "workspace-write"

[permissions.filesystem]
deny_read = [
    "buildsystem/**",
    "keystore/**",
    "keystores/**",
    "secrets/**",
    "secret/**",
    "credentials/**",
    "credential/**",
    ".env",
    "local.properties",
    "app/google-services.json",
    "google-services.json",
    "googleplayprovider.json",
]

# App endpoint/OAuth config assets.
# Removed glob rule "app/src/*/assets/configs/*.json" because Codex rejects file globs.

[features]
hooks = true

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/stop_quality_check.py"'
timeout = 240
statusMessage = "Running final quality checks"
