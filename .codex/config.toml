sandbox_mode = "workspace-write"

[permissions.filesystem]
allow_read = [
    ".codex/.env",
    ".codex/.env.*",
    ".codex/**/.env",
    ".codex/**/.env.*",
    ".codex/**/*.env",
    ".codex/**/*.env.*",
]

deny_read = [
    "buildsystem/**",
    "keystore/**",
    "keystores/**",
    "secrets/**",
    "secret/**",
    "credentials/**",
    "credential/**",
    ".env",
    ".env.*",
    "**/.env",
    "**/.env.*",
    "local.properties",
    "**/local.properties",
    "app/google-services.json",
    "google-services.json",
    "**/google-services.json",
    "googleplayprovider.json",
    "**/googleplayprovider.json",
    "*service-account*.json",
    "**/*service-account*.json",
    "*credentials*.json",
    "**/*credentials*.json",
    "*credential*.json",
    "**/*credential*.json",
    "app/src/*/assets/configs/*.json",
    "*.jks",
    "**/*.jks",
    "*.keystore",
    "**/*.keystore",
    "*.p12",
    "**/*.p12",
    "*.pfx",
    "**/*.pfx",
    "*.pem",
    "**/*.pem",
    "*.key",
    "**/*.key",
]
